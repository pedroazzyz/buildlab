:0 0 8px;font-size:15px}.meta{font-size:11px;color:var(--muted);display:flex;gap:14px;margin:10px 0}.card-body .btn{width:100%;margin-top:8px}.progress{height:5px;background:#34343a;border-radius:8px;overflow:hidden}.progress i{display:block;height:100%;background:var(--orange);border-radius:8px}.tools{display:flex;gap:10px;align-items:center;margin:18px 0}.field{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:11px 13px;color:var(--text);outline:0}.field:focus{border-color:var(--orange)}.tools .field:first-child{flex:1}.tabs{display:flex;gap:8px;margin:14px 0 20px;flex-wrap:wrap}.tab{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:20px;padding:8px 14px;font-size:12px}.tab.active{background:var(--orange);color:#17120a;border-color:var(--orange);font-weight:700}.layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:18px}.panel{padding:20px}.lesson-image{height:260px;border-radius:11px;margin:18px 0;background-size:cover;background-position:center}.lesson-copy{font-size:15px;line-height:1.8;color:#ceced2}.lesson-copy h3{color:var(--text);font-size:17px;margin-top:23px}.lesson-side{align-self:start}.lesson-side h3{font-size:14px;margin:2px 0 15px}.lesson-item{width:100%;text-align:left;padding:11px 9px;background:transparent;border:0;border-radius:8px;color:#c9c9ce;font-size:12px;display:flex;gap:10px}.lesson-item:hover,.lesson-item.active{background:#282017;color:var(--orange)}.lesson-item small{color:var(--muted);display:block;margin-top:3px}.lesson-controls{display:flex;justify-content:space-between;margin-top:18px}.question{font-size:20px;margin:8px 0 18px}.option{display:block;width:100%;text-align:left;padding:13px 15px;background:#17171b;border:1px solid var(--line);border-radius:9px;margin:9px 0}.option:hover{border-color:#976013}.option.selected{border-color:var(--orange);background:#251d13}.feedback{padding:13px;border-radius:9px;margin-top:15px;line-height:1.5}.feedback.good{background:#163020;color:#9ce0b9}.feedback.bad{background:#351a1a;color:#ffc0b9}.glossary{display:grid;grid-template-columns:210px 1fr;gap:16px}.term{display:grid;grid-template-columns:60px 1fr;gap:14px;padding:13px;border-bottom:1px solid var(--line)}.term:last-child{border:0}.term-icon{height:56px;border-radius:9px;background:#27211a;display:grid;place-items:center;font-size:25px}.term h3{margin:2px 0 5px;font-size:14px}.term p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}.badge{display:inline-block;background:#2a2013;color:var(--orange);padding:7px 10px;border-radius:16px;font-size:11px;margin:5px 5px 0 0}.chart{display:flex;align-items:end;gap:18px;height:190px;padding:15px 15px 0;border-bottom:1px solid var(--line)}.bar{flex:1;background:linear-gradient(#ffad33,#dd7a00);border-radius:6px 6px 0 0;position:relative;min-height:8px}.bar span{position:absolute;top:100%;width:100%;text-align:center;color:var(--muted);font-size:10px;padding-top:8px}.notice{background:#201a11;color:#d0b88f;border:1px solid #49361d;padding:13px 15px;border-radius:10px;font-size:12px;line-height:1.55}.empty{padding:36px;text-align:center;color:var(--muted)}.mobile-nav{display:none}
@media(max-width:900px){.sidebar{width:190px}.main{margin-left:190px;padding-inline:24px}.courses{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,1fr)}.hero:after{right:-4%;font-size:125px}.layout{grid-template-columns:minmax(0,1fr) 230px}}

</style></head><body><div id="app"></div><script src="supabase-config.js"></script><script src="backend.js"></script><script>
const courses=[
{id:'fundamentos',title:'Fundamentos da Construção Civil',level:'Iniciante',category:'Fundamentos',hours:'4h',lessons:8,emoji:'🦺',image:'photo-1504307651254-35680f356dfd',description:'Conheça os conceitos básicos, as etapas de uma obra e as pessoas que fazem a construção acontecer.',modules:[{title:'Começando pela obra',lessons:[['O que é construção civil?','A construção civil reúne atividades de planejamento, projeto e execução de edificações e infraestrutura. Casas, escolas, pontes e redes de água são exemplos do que esse setor entrega para a sociedade.','Uma obra funciona como um trabalho em equipe: arquitetura define espaços, engenharia desenvolve soluções técnicas e diferentes profissionais executam etapas planejadas.','Pense na construção de uma casa como uma sequência: primeiro se planeja o que será construído, depois se prepara o terreno, monta-se a estrutura e finalizam-se os ambientes.'],['Principais áreas','A construção civil tem áreas que trabalham em conjunto. Edificações cuidam de casas e prédios; infraestrutura inclui estradas, pontes e saneamento; e a gestão organiza prazos, recursos e equipes.','Cada projeto combina especialidades diferentes. Um edifício, por exemplo, precisa de arquitetura, estrutura, instalações e planejamento de obra.','As áreas se encontram no planejamento. Uma mudança no projeto pode afetar materiais, prazo e a ordem das atividades.'],['Materiais básicos','Materiais como cimento, agregados, aço, madeira e blocos cumprem funções diferentes. O cimento é um componente que, misturado com água e agregados, pode formar pastas e concretos.','Concreto costuma combinar cimento, água, areia e pedra britada. Argamassa usa cimento ou cal, areia e água para assentar blocos ou revestir superfícies.','O material adequado depende do uso previsto e das especificações do projeto.'],['Segurança na obra','O canteiro de obras tem riscos que variam conforme a atividade. Planejamento, organização, sinalização, equipamentos de proteção e orientação profissional ajudam a reduzir esses riscos.','Observar uma obra em segurança é diferente de executar uma tarefa. Operar equipamentos, trabalhar em altura ou fazer instalações exige formação, autorização e supervisão adequadas.','Aprenda os conceitos em caráter introdutório. Siga sempre as regras e orientações dos profissionais responsáveis.']] }]},
{id:'materiais',title:'Materiais de Construção',level:'Iniciante',category:'Materiais',hours:'3h',lessons:6,emoji:'🧱',image:'photo-1518709268805-4e9042af9f23',description:'Aprenda para que servem os materiais mais comuns e como eles se combinam numa construção.',modules:[{title:'Conhecendo os materiais',lessons:[['Concreto: uma mistura resistente','Concreto é uma mistura de cimento, água e agregados, como areia e brita. Depois de preparado, endurece e pode resistir bem a esforços de compressão.','A proporção dos componentes e o modo de preparo variam conforme o uso. Projetos e profissionais definem a especificação apropriada.','Concreto não é sinônimo de cimento: cimento é apenas um dos ingredientes.'],['Argamassa e assentamento','Argamassa é uma mistura que pode unir blocos ou revestir superfícies. É composta geralmente de aglomerante, agregado miúdo e água.','Na alvenaria, a argamassa de assentamento ocupa as juntas entre as unidades. Produtos industrializados podem trazer instruções específicas de preparo.','Não confunda argamassa de assentamento com concreto: a função e a composição são diferentes.']] }]},
{id:'ferramentas',title:'Ferramentas e Equipamentos',level:'Iniciante',category:'Equipamentos',hours:'2h',lessons:5,emoji:'🛠️',image:'photo-1581147036324-c1c0d0cfa1ce',description:'Uma introdução às ferramentas comuns, suas finalidades e aos cuidados com o uso seguro.',modules:[{title:'Ferramentas no canteiro',lessons:[['Ferramentas manuais','Trena, nível, colher de pedreiro e desempenadeira são exemplos de ferramentas que aparecem em diferentes etapas de uma obra. Cada uma atende uma finalidade.','A trena mede distâncias; o nível ajuda a verificar alinhamento; a colher de pedreiro auxilia na aplicação de argamassa.','A escolha e o uso correto dependem da tarefa e de instruções profissionais.']] }]},
{id:'projetos',title:'Leitura Básica de Projetos',level:'Intermediário',category:'Projetos',hours:'5h',lessons:7,emoji:'📐',image:'photo-1503387762-592deb58ef4e',description:'Entenda o papel das plantas e os elementos básicos presentes nos desenhos técnicos.',modules:[{title:'Primeiros passos no projeto',lessons:[['O que é uma planta baixa?','A planta baixa representa um pavimento visto de cima, como se um corte horizontal revelasse a disposição dos ambientes. Nela podem aparecer paredes, portas, janelas e cotas.','As cotas indicam medidas conforme a convenção do desenho. A escala relaciona o tamanho desenhado ao tamanho real.','Uma planta é parte de um conjunto de documentos. Ela deve ser lida junto das demais informações do projeto.']] }]},
{id:'etapas',title:'Etapas de uma Obra',level:'Iniciante',category:'Fundamentos',hours:'3h',lessons:6,emoji:'🏗️',image:'photo-1541888946425-d81bb19240f5',description:'Veja a sequência geral entre planejamento, preparação do terreno, estrutura e acabamentos.',modules:[{title:'Do plano ao espaço',lessons:[['Planejamento e preparação','Antes da execução, o projeto e o planejamento ajudam a organizar escopo, recursos e sequência de atividades. A preparação do terreno depende das condições locais e do projeto.','Licenças, estudos e serviços preliminares variam conforme a obra e as regras aplicáveis.','O planejamento conecta as decisões de projeto com a organização do trabalho.']] }]},
{id:'estrutura',title:'Estrutura das Edificações',level:'Intermediário',category:'Estrutura',hours:'4h',lessons:6,emoji:'🏢',image:'photo-1590725140246-20acdee442be',description:'Conheça elementos como fundações, pilares, vigas e lajes e a função geral de cada um.',modules:[{title:'Elementos estruturais',lessons:[['Como a estrutura recebe cargas','A estrutura conduz cargas da edificação até o solo. Fundações transferem essas ações ao terreno; pilares e paredes estruturais conduzem cargas verticais; vigas e lajes distribuem esforços.','A configuração depende do projeto estrutural e das condições da construção.','Essa explicação é introdutória e não substitui cálculo ou orientação de engenharia.']] }]},
{id:'orcamento',title:'Noções de Orçamento de Obras',level:'Intermediário',category:'Fundamentos',hours:'3h',lessons:5,emoji:'📊',image:'photo-1454165804606-c3d57bc86b40',description:'Uma visão inicial de quantitativos, custos e planejamento de recursos para uma obra.',modules:[{title:'Entendendo os custos',lessons:[['O que entra no orçamento?','Um orçamento organiza estimativas de materiais, mão de obra, equipamentos e outros custos previstos para realizar um serviço.','O levantamento de quantidades parte dos documentos do projeto e precisa considerar critérios de medição definidos.','O orçamento é uma estimativa que depende das informações disponíveis e das condições da obra.']] }]},
{id:'seguranca',title:'Segurança na Construção Civil',level:'Iniciante',category:'Segurança',hours:'3h',lessons:5,emoji:'🦺',image:'photo-1516937941344-00b4e0337589',description:'Compreenda princípios de prevenção, organização do canteiro e comunicação de riscos.',modules:[{title:'Prevenção é trabalho em equipe',lessons:[['Reconhecer riscos','Riscos variam conforme a tarefa e o ambiente. Planejamento, capacitação, procedimentos e comunicação ajudam equipes a identificar e controlar situações perigosas.','Proteções e equipamentos devem ser selecionados conforme análise da atividade e orientação responsável.','Conteúdo educacional introdutório não habilita ninguém a executar atividade de risco.']] }]}
];
const terms=[['Concreto','Materiais','🪨','Material feito de cimento, água e agregados como areia e brita. Depois de endurecer, é usado em diversos elementos da construção.'],['Argamassa','Materiais','🧱','Mistura usada, por exemplo, para unir blocos ou revestir superfícies. Sua composição depende da aplicação.'],['Fundação','Estrutura','🏗️','Parte da construção que transmite as cargas da edificação ao terreno.'],['Viga','Estrutura','📏','Elemento estrutural que recebe cargas e as transfere para apoios, como pilares ou paredes estruturais.'],['Pilar','Estrutura','🏢','Elemento que conduz cargas principalmente na direção vertical dentro de um sistema estrutural.'],['Laje','Estrutura','⬜','Elemento que forma pisos ou coberturas e distribui cargas para os apoios previstos no projeto.'],['Alvenaria','Técnicas','🧱','Sistema de construção feito com unidades como blocos ou tijolos unidos por argamassa.'],['Reboco','Técnicas','🪣','Camada de acabamento aplicada sobre uma base revestida, conforme o sistema especificado.'],['Planta baixa','Projetos','📐','Desenho de um pavimento visto de cima, mostrando a organização dos ambientes e informações do projeto.'],['Trena','Ferramentas','📏','Ferramenta de medição de comprimentos. O resultado precisa ser lido com cuidado e conforme a tarefa.'],['EPI','Segurança','🦺','Equipamento de proteção individual selecionado de acordo com os riscos da atividade e as orientações de segurança.'],['Canteiro de obras','Equipamentos','🚧','Área organizada para apoiar a execução de uma obra, incluindo circulação, armazenamento e espaços de trabalho.']];
const categories=['Todos','Materiais','Estrutura','Ferramentas','Equipamentos','Técnicas','Projetos','Segurança'];const quiz=[{q:'Qual é a função principal de uma fundação?',a:['Transferir as cargas da edificação ao terreno','Decorar os ambientes internos','Substituir as paredes da casa','Impermeabilizar todas as janelas'],correct:0,ex:'A fundação recebe as cargas previstas no projeto e as transmite ao terreno.'},{q:'Qual ingrediente é um componente do concreto?',a:['Cimento','Tinta acrílica','Vidro temperado','Espuma isolante'],correct:0,ex:'O concreto combina cimento, água e agregados, como areia e brita.'},{q:'O que uma planta baixa costuma representar?',a:['Um pavimento visto de cima','O terreno visto do espaço','A fachada em perspectiva','Uma lista de materiais'],correct:0,ex:'A planta baixa representa a organização de um pavimento como visto de cima.'},{q:'Para que serve uma trena?',a:['Medir comprimentos','Misturar concreto','Cortar vergalhões','Verificar corrente elétrica'],correct:0,ex:'A trena é uma ferramenta de medição de comprimentos.'},{q:'O que a argamassa pode fazer na alvenaria?',a:['Unir unidades de alvenaria','Calcular cargas estruturais','Medir o alinhamento','Substituir o projeto'],correct:0,ex:'A argamassa pode preencher as juntas e unir blocos ou tijolos.'}];
const blank={done:{},scores:[],activity:[],started:[],lesson:{},};let data;try{data={...blank,...JSON.parse(localStorage.getItem('buildlab-v1')||'{}')}}catch{data={...blank}};let page='home',courseId=courses[0].id,lessonIndex=0,quizIndex=0,selected=null,answered=false,filterLevel='Todos',search='',termCategory='Todos',termSearch='',authMode='login',authMessage='',authBusy=false;let saveTimer;const save=()=>{localStorage.setItem('buildlab-v1',JSON.stringify(data));if(BuildLabBackend.ready()&&BuildLabBackend.user){clearTimeout(saveTimer);saveTimer=setTimeout(()=>BuildLabBackend.putProgress(data).catch(e=>{console.error('BuildLab sync:',e);window.__syncError=e.message}),350)}};const log=(text)=>{data.activity.unshift({text,date:new Date().toLocaleDateString('pt-BR')});data.activity=data.activity.slice(0,40);save()};const pct=(id)=>{let c=courses.find(x=>x.id===id);return Math.round((data.done[id]||[]).length/(c?.lessons||1)*100)};const allLessons=courses.reduce((n,c)=>n+c.lessons,0);const overall=()=>Math.round(Object.values(data.done).reduce((n,a)=>n+a.length,0)/allLessons*100);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const img=(id,w=900)=>`https://images.unsplash.com/${id}?auto=format&fit=crop&w=${w}&q=82`;const lessonList=(c)=>c.modules.flatMap(m=>m.lessons.map(x=>({module:m.title,title:x[0],body:x[1],detail:x[2],example:x[3]})));const current=()=>courses.find(c=>c.id===courseId)||courses[0];const lessonDone=(c,i)=>((data.done[c.id]||[]).includes(i));const route=p=>{if(p==='progress'&&BuildLabBackend.ready()&&!BuildLabBackend.user){authMode='login';authMessage='Entre na sua conta para acessar seu progresso sincronizado.';p='auth'}page=p;render();window.scrollTo(0,0)};const openCourse=id=>{courseId=id;lessonIndex=+(data.lesson[id]||0);if(!data.started.includes(id)){data.started.push(id);log(`Começou ${courses.find(x=>x.id===id).title}`)}route('course')};function nav(){return `<div class="brand"><span class="hardhat">◢</span> Build<b>Lab</b></div><nav class="nav">${[['home','⌂','Início'],['courses','▣','Cursos'],['glossary','◉','Glossário'],['quiz','♧','Quiz'],['progress','▥','Meu Progresso'],['about','ⓘ','Sobre']].map(([p,i,t])=>`<button class="${page===p?'active':''}" onclick="route('${p}')"><span class="ico">${i}</span>${t}</button>`).join('')}</nav><div class="side-note"><strong>Continue estudando</strong>${data.started.length?esc(courses.find(c=>c.id===data.started.at(-1))?.title||'Escolha um curso'):'Sua jornada começa com uma aula.'}<div class="progress"><i style="width:${overall()}%"></i></div><div style="text-align:right;margin-top:6px">${overall()}% concluído</div></div>`}function courseCard(c){return `<article class="card course" onclick="openCourse('${c.id}')"><div class="cover" style="background-image:url('${img(c.image,650)}')"><span class="level">${c.level}</span></div><div class="card-body"><h3>${c.title}</h3><p style="color:var(--muted);font-size:12px;line-height:1.5;min-height:36px">${c.description}</p><div class="meta"><span>◷ ${c.hours}</span><span>▤ ${c.lessons} aulas</span><span>${pct(c.id)}%</span></div><div class="progress"><i style="width:${pct(c.id)}%"></i></div><button class="btn" onclick="event.stopPropagation();openCourse('${c.id}')">${pct(c.id)?'Continuar':'Acessar curso'}　→</button></div></article>`}function home(){let active=data.started.length?courses.find(c=>c.id===data.started.at(-1)):courses[0];return `<section class="hero"><div class="hero-copy"><span class="eyebrow">Aprenda no seu ritmo</span><h1>Construção civil<br>de forma <span>simples e prática</span></h1><p>Explore conceitos, faça cursos, teste seus conhecimentos e acompanhe seu progresso, tudo em um só lugar.</p><div class="actions"><button class="btn" onclick="openCourse('${active.id}')">▶　${data.started.length?'Continuar aprendendo':'Começar a aprender'}　→</button><button class="btn secondary" onclick="route('about')">Conheça a plataforma</button></div></div></section><div class="grid stats"><div class="stat"><div class="stat-icon">▣</div><div class="stat-label">Cursos iniciados</div><div class="stat-value">${data.started.length} de ${courses.length}</div></div><div class="stat"><div class="stat-icon">✓</div><div class="stat-label">Aulas concluídas</div><div class="stat-value">${Object.values(data.done).reduce((n,a)=>n+a.length,0)} de ${allLessons}</div></div><div class="stat"><div class="stat-icon">◉</div><div class="stat-label">Progresso geral</div><div class="stat-value">${overall()}%</div></div><div class="stat"><div class="stat-icon">♧</div><div class="stat-label">Melhor quiz</div><div class="stat-value">${data.scores.length?Math.max(...data.scores)+'%':'Ainda não feito'}</div></div></div><div class="section-head"><h2>${data.started.length?'Continue aprendendo':'Explore os primeiros cursos'}</h2><button class="text-button" onclick="route('courses')">Ver todos →</button></div><div class="grid courses">${courseCard(active)}${courses.filter(c=>c.id!==active.id).slice(0,2).map(courseCard).join('')}</div><div class="section-head"><h2>Explore a plataforma</h2></div><div class="grid stats">${[['▣','Cursos','Trilhas curtas para começar do básico.','courses'],['◉','Glossário','Termos técnicos explicados de forma simples.','glossary'],['♧','Quiz','Revise o que aprendeu com perguntas rápidas.','quiz'],['▥','Meu progresso','Acompanhe seu estudo nesta sessão e nas próximas.','progress']].map(([i,t,d,p])=>`<div class="stat" style="cursor:pointer" onclick="route('${p}')"><div class="stat-icon">${i}</div><div class="stat-value" style="font-size:16px">${t}</div><div class="stat-label">${d}</div></div>`).join('')}</div>`}
function coursesPage(){let list=courses.filter(c=>(filterLevel==='Todos'||c.level===filterLevel)&&`${c.title} ${c.category}`.toLowerCase().includes(search.toLowerCase()));return `<h1 class="page-title">Cursos</h1><p class="sub">Explore nossa biblioteca de cursos e comece sua jornada na construção civil.</p><div class="tools"><input class="field" placeholder="⌕  Buscar cursos..." value="${esc(search)}" oninput="search=this.value;updateCourses()"><select class="field" onchange="filterLevel=this.value;updateCourses()">${['Todos','Iniciante','Intermediário','Avançado'].map(x=>`<option ${filterLevel===x?'selected':''}>${x}</option>`)}</select></div><div class="tabs">${['Todos','Fundamentos','Materiais','Estrutura','Equipamentos','Projetos','Segurança'].map(x=>`<button class="tab ${filterLevel==='Todos'&&x==='Todos'?'active':''}" onclick="filterCategory=\x27${x}\x27;updateCourses()">${x}</button>`).join('')}</div><div id="courseGrid" class="grid courses">${list.length?list.map(courseCard).join(''):'<div class="empty">Nenhum curso encontrado. Tente outro termo.</div>'}</div>`}let filterCategory='Todos';function updateCourses(){let el=document.getElementById('courseGrid');if(!el)return;let list=courses.filter(c=>(filterLevel==='Todos'||c.level===filterLevel)&&(filterCategory==='Todos'||c.category===filterCategory)&&`${c.title} ${c.category}`.toLowerCase().includes(search.toLowerCase()));el.innerHTML=list.length?list.map(courseCard).join(''):'<div class="empty">Nenhum curso encontrado. Tente outro termo.</div>'}function coursePage(){let c=current(),list=lessonList(c),l=list[lessonIndex]||list[0];return `<div style="display:flex;justify-content:space-between;gap:20px;align-items:center;flex-wrap:wrap"><div><button class="text-button" onclick="route('courses')">← Voltar para cursos</button><h1 class="page-title" style="margin-top:12px">${c.title}</h1><p class="sub">${c.description}</p></div><div style="min-width:160px;font-size:11px;color:var(--muted)">Progresso do curso　<strong style="color:var(--text)">${pct(c.id)}%</strong><div class="progress" style="margin-top:9px"><i style="width:${pct(c.id)}%"></i></div></div></div><div class="layout"><article class="panel"><span class="eyebrow">${l.module} · Aula ${lessonIndex+1}</span><h2 style="font-size:22px;margin:9px 0">${l.title}</h2><div class="lesson-image" style="background-image:url('${img(c.image,1100)}')"></div><div class="lesson-copy"><p>${l.body}</p><h3>Como entender na prática</h3><p>${l.detail}</p><div class="notice">${l.example}</div><h3>Resumo da aula</h3><p>${l.body.split('.')[0]}.</p><p style="font-size:12px;color:var(--muted)">Conteúdo introdutório para fins educacionais. Projetos e atividades profissionais exigem orientação de profissionais habilitados.</p></div><div class="lesson-controls"><button class="btn secondary" ${lessonIndex===0?'disabled':''} onclick="setLesson(${lessonIndex-1})">← Aula anterior</button><button class="btn" onclick="completeLesson()">${lessonDone(c,lessonIndex)?'Aula concluída ✓':'Marcar como concluída ✓'}</button><button class="btn secondary" onclick="setLesson(${Math.min(lessonIndex+1,list.length-1)})">Próxima aula →</button></div></article><aside class="panel lesson-side"><h3>Conteúdo do curso</h3><div style="color:var(--muted);font-size:11px;margin-bottom:10px">${list.length} aulas · ${c.modules.length} módulo</div>${list.map((x,i)=>`<button class="lesson-item ${i===lessonIndex?'active':''}" onclick="setLesson(${i})"><span>${lessonDone(c,i)?'✓':'○'}</span><span>${x.title}<small>Aula ${i+1}</small></span></button>`).join('')}</aside></div>`}function setLesson(i){lessonIndex=Math.max(0,Math.min(lessonList(current()).length-1,i));data.lesson[courseId]=lessonIndex;save();render()}function completeLesson(){let c=current(),done=data.done[c.id]||[];if(!done.includes(lessonIndex)){done.push(lessonIndex);data.done[c.id]=done;log(`Concluiu: ${lessonList(c)[lessonIndex].title}`)}save();if(lessonIndex<lessonList(c).length-1)lessonIndex++;data.lesson[c.id]=l function quizPage(){let q=quiz[quizIndex];return `<h1 class="page-title">Quiz de construção civil</h1><p class="sub">Teste o que você aprendeu. Responda no seu ritmo e veja a explicação de cada questão.</p><div class="panel" style="max-width:800px;margin:auto"><div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted)"><span>${answered?'Resposta registrada':'Uma pergunta por vez'}</span><span>Pergunta ${quizIndex+1} de ${quiz.length}</span></div><div class="progress" style="margin:10px 0 22px"><i style="width:${(quizIndex+(answered?1:0))/quiz.length*100}%"></i></div><h2 class="question">${q.q}</h2>${q.a.map((a,i)=>`<button class="option ${selected===i?'selected':''}" onclick="choose(${i})" ${answered?'disabled':''}>${String.fromCharCode(65+i)}.　${a}</button>`).join('')}${answered?`<div class="feedback ${selected===q.correct?'good':'bad'}"><strong>${selected===q.correct?'Resposta correta!':'Vamos revisar.'}</strong> ${q.ex}</div>`:''}<div class="lesson-controls"><button class="btn secondary" onclick="route('home')">Sair do quiz</button>${!answered?`<button class="btn" onclick="submitAnswer()" ${selected===null?'disabled':''}>Confirmar resposta →</button>`:`<button class="btn" onclick="nextQuestion()">${quizIndex===quiz.length-1?'Ver resultado':'Próxima pergunta →'}</button>`}</div></div>`}function choose(i){if(answered)return;selected=i;render()}function submitAnswer(){if(selected===null)return;data.quizAnswers=data.quizAnswers||[];data.quizAnswers[quizIndex]=selected;save();answered=true;render()}function nextQuestion(){if(quizIndex===quiz.length-1){let score=Math.round(quiz.reduce((n,q,i)=>n+(data.quizAnswers?.[i]===q.correct?1:0),0)/quiz.length*100);data.scores.push(score);log(`Terminou um quiz com ${score}% de acerto`);data.quizAnswers=[];save();page='quizResult';resultScore=score;render();return}quizIndex++;selected=null;answered=false;render()}let resultScore=0;function quizResult(){return `<div class="panel" style="max-width:680px;margin:40px auto;text-align:center;padding:38px"><div style="font-size:48px">${resultScore>=80?'🏆':'📘'}</div><span class="eyebrow">Quiz concluído</span><h1 class="page-title" style="margin:10px">${resultScore}% de acerto</h1><p class="sub">${resultScore>=80?'Ótimo trabalho! Continue explorando novos temas.':'Cada tentativa é uma oportunidade de aprender. Revise as aulas e tente novamente.'}</p><div class="actions" style="justify-content:center"><button class="btn" onclick="startQuiz()">Tentar novamente</button><button class="btn secondary" onclick="route('progress')">Ver meu progresso</button></div></div>`}function startQuiz(){quizIndex=0;selected=null;answered=false;data.quizAnswers=[];route('quiz')}function glossary(){let list=terms.filter(t=>(termCategory==='Todos'||t[1]===termCategory)&&`${t[0]} ${t[3]}`.toLowerCase().includes(termSearch.toLowerCase()));return `<h1 class="page-title">Glossário</h1><p class="sub">Aprenda o significado dos principais termos da construção civil.</p><div class="tools"><input class="field" placeholder="⌕  Buscar um termo..." value="${esc(termSearch)}" oninput="termSearch=this.value;updateTerms()"></div><div class="glossary"><aside class="panel"><h3 style="margin-top:0">Categorias</h3>${categories.map(x=>`<button class="tab ${termCategory===x?'active':''}" style="display:block;margin:6px 0" onclick="termCategory='${x}';render()">${x}</button>`).join('')}</aside><section class="panel" id="termList">${termsMarkup(list)}</section></div>`}function termsMarkup(list){return list.length?list.map(t=>`<article class="term"><div class="term-icon">${t[2]}</div><div><h3>${t[0]} <span style="font-size:10px;color:var(--orange);font-weight:500">${t[1]}</span></h3><p>${t[3]}</p></div></article>`).join(''):'<div class="empty">Nenhum termo encontrado.</div>'}function updateTerms(){let el=document.getElementById('termList');if(el)el.innerHTML=termsMarkup(terms.filter(t=>(termCategory==='Todos'||t[1]===termCategory)&&`${t[0]} ${t[3]}`.toLowerCase().includes(termSearch.toLowerCase())))}
function progressPage(){let started=data.started.map(id=>courses.find(c=>c.id===id)).filter(Boolean),doneCount=Object.values(data.done).reduce((n,a)=>n+a.length,0),maxScore=data.scores.length?Math.max(...data.scores):0;return `<h1 class="page-title">Meu Progresso</h1><p class="sub">Acompanhe sua evolução e retome seus estudos quando quiser.</p><div class="grid stats"><div class="stat"><div class="stat-icon">▣</div><div class="stat-label">Cursos iniciados</div><div class="stat-value">${data.started.length} de ${courses.length}</div></div><div class="stat"><div class="stat-icon">▶</div><div class="stat-label">Aulas concluídas</div><div class="stat-value">${doneCount} de ${allLessons}</div></div><div class="stat"><div class="stat-icon">◎</div><div class="stat-label">Progresso geral</div><div class="stat-value">${overall()}%</div></div><div class="stat"><div class="stat-icon">♧</div><div class="stat-label">Melhor quiz</div><div class="stat-value">${data.scores.length?maxScore+'%':'—'}</div></div></div><div class="grid" style="grid-template-columns:1fr 1fr"><section class="panel"><h2 style="font-size:16px">Seu progresso por curso</h2>${started.length?started.map(c=>`<div style="margin:18px 0"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:8px"><span>${c.title}</span><span style="color:var(--muted)">${pct(c.id)}%</span></div><div class="progress"><i style="width:${pct(c.id)}%"></i></div></div>`).join(''):'<p class="sub">Comece um curso para ver seu progresso aqui.</p>'}</section><section class="panel"><h2 style="font-size:16px">Atividade recente</h2>${data.activity.length?data.activity.slice(0,8).map(a=>`<div style="padding:12px 0;border-bottom:1px solid var(--line);font-size:12px">${esc(a.text)}<div style="color:var(--muted);font-size:10px;margin-top:4px">${a.date}</div></div>`).join(''):'<p class="sub">Suas atividades aparecerão aqui enquanto você aprende.</p>'}</section></div><div class="section-head"><h2>Conquistas</h2></div><div class="panel"><span class="badge">${doneCount>=1?'✓':''} Primeira aula ${doneCount>=1?'concluída':'— continue estudando'}</span><span class="badge">${data.scores.length?'✓':''} Primeiro quiz ${data.scores.length?'concluído':'— teste o que aprendeu'}</span><span class="badge">${overall()>=50?'✓':''} Metade do percurso ${overall()>=50?'alcançada':'— passo a passo'}</span></div><div class="notice" style="margin-top:16px">Seus dados de atividade ficam salvos somente neste navegador. Eles não são sincronizados entre dispositivos ou usuários.</div>`}
function about(){return `<h1 class="page-title">Sobre o BuildLab</h1><p class="sub">Um espaço de aprendizagem para dar os primeiros passos na construção civil.</p><div class="panel" style="max-width:850px"><span class="eyebrow">Aprender com clareza</span><h2 style="font-size:25px;margin:12px 0">Construção civil explicada de um jeito mais simples.</h2><p class="lesson-copy">O BuildLab é uma plataforma educacional introdutória para quem quer conhecer os conceitos, materiais e etapas que fazem parte da construção civil. O conteúdo é organizado em aulas curtas, glossário e quizzes para apoiar a revisão.</p><div class="grid stats" style="grid-template-columns:repeat(3,1fr);margin-bottom:10px"><div class="stat"><div class="stat-icon">①</div><div class="stat-value" style="font-size:15px">Explore</div><div class="stat-label">Escolha um curso e siga as aulas no seu ritmo.</div></div><div class="stat"><div class="stat-icon">②</div><div class="stat-value" style="font-size:15px">Pratique</div><div class="stat-label">Revise os conceitos com perguntas rápidas.</div></div><div class="stat"><div class="stat-icon">③</div><div class="stat-value" style="font-size:15px">Acompanhe</div><div class="stat-label">Veja as atividades e o progresso deste navegador.</div></div></div><div class="notice">Material educacional introdutório. Não representa certificação profissional, autorização para executar serviços nem substitui projetos, normas, treinamento e supervisão adequados.</div><h3 style="margin-top:26px">Privacidade e armazenamento</h3><p class="lesson-copy" style="font-size:13px">Esta versão salva localmente neste navegador seu progresso, atividades e resultados de quiz. Ela não possui cadastro, login, banco de dados ou sincronização multiusuário. Limpar os dados do navegador pode apagar esse histórico.</p><button class="btn" onclick="route('courses')">Explorar cursos →</button></div>`}function authPage(){return `<div class="panel" style="max-width:480px;margin:35px auto;padding:28px"><span class="eyebrow">Sua jornada, em qualquer dispositivo</span><h1 class="page-title" style="margin:10px 0">${authMode==='login'?'Entrar':'Criar conta'}</h1><p class="sub">${authMode==='login'?'Acesse seu progresso e continue de onde parou.':'Crie sua conta gratuita para sincronizar cursos e resultados.'}</p><form onsubmit="submitAuth(event)"><label style="display:block;margin:14px 0 6px">E-mail</label><input class="field" style="width:100%" type="email" name="email" autocomplete="email" required maxlength="254" placeholder="voce@exemplo.com"><label style="display:block;margin:14px 0 6px">Senha</label><input class="field" style="width:100%" type="password" name="password" autocomplete="${authMode==='login'?'current-password':'new-password'}" minlength="8" required placeholder="Mínimo de 8 caracteres"><p class="notice" style="margin-top:14px">${BuildLabBackend.ready()?'Sua senha é processada pelo Supabase Auth e nunca armazenada pelo BuildLab.':'Modo local: configure Supabase para habilitar cadastro e sincronização.'}</p>${authMessage?`<p role="status" style="color:var(--orange);line-height:1.5">${esc(authMessage)}</p>`:''}<button class="btn" style="width:100%;margin-top:12px" ${authBusy||!BuildLabBackend.ready()?'disabled':''}>${authBusy?'Aguarde…':authMode==='login'?'Entrar':'Criar conta'}</button></form><button class="text-button" style="margin-top:17px" onclick="authMode='${authMode==='login'?'signup':'login'}';authMessage='';render()">${authMode==='login'?'Ainda não tem conta? Criar conta':'Já tem conta? Entrar'}</button></div>`}
async function submitAuth(event){event.preventDefault();if(authBusy||!BuildLabBackend.ready())return;const form=new FormData(event.target),email=String(form.get('email')||'').trim().toLowerCase(),password=String(form.get('password')||'');if(password.length<8){authMessage='Use uma senha com pelo menos 8 caracteres.';render();return}authBusy=true;authMessage='';render();try{const result=authMode==='login'?await BuildLabBackend.signIn(email,password):await BuildLabBackend.signUp(email,password);if(!BuildLabBackend.user){authMessage='Conta criada. Verifique seu e-mail para confirmar o cadastro e depois entre.';return}const remote=await BuildLabBackend.getProgress();if(remote){data={...blank,...remote};localStorage.setItem('buildlab-v1',JSON.stringify(data));authMessage='';page='home'}else{await BuildLabBackend.putProgress(data);authMessage='';page='home'}}catch(e){authMessage=e.message||'Não foi possível concluir. Confira os dados e tente novamente.'}finally{authBusy=false;render()}}
async function signOut(){try{await BuildLabBackend.signOut()}catch(e){console.warn('Logout remoto:',e)}data={...blank};localStorage.setItem('buildlab-v1',JSON.stringify(data));page='home';authMessage='Você saiu da conta.';render()}
async function initializeAccount(){if(!BuildLabBackend.ready()){render();return}try{if(BuildLabBackend.user){const remote=await BuildLabBackend.getProgress();if(remote){data={...blank,...remote};localStorage.setItem('buildlab-v1',JSON.stringify(data))}else await BuildLabBackend.putProgress(data)}}catch(e){console.error('BuildLab account:',e)}render()}
function render(){document.title=`BuildLab — ${({auth:'Conta',home:'Aprenda construção civil',courses:'Cursos',course:current().title,quiz:'Quiz',quizResult:'Resultado do quiz',glossary:'Glossário',progress:'Meu progresso',about:'Sobre'})[page]}`;let views={auth:authPage,home,courses:coursesPage,course:coursePage,quiz:quizPage,quizResult,glossary,progress:progressPage,about};document.getElementById('app').innerHTML=`<div class="shell"><aside class="sidebar">${nav()}</aside><main class="main"><header class="mobile-head"><div class="brand"><span class="hardhat">◢</span> Build<b>Lab</b></div><span class="avatar">B</span></header><div class="topbar"><span class="crumb">Aprendizado　/　<span style="color:var(--text)">${({auth:'Conta',home:'Início',courses:'Cursos',course:'Curso',quiz:'Quiz',quizResult:'Resultado',glossary:'Glossário',progress:'Meu progresso',about:'Sobre'})[page]}</span></span><div class="user"><span class="avatar">B</span>${BuildLabBackend.user?esc(BuildLabBackend.user.email):'Visitante'}　<button class="text-button" onclick="${BuildLabBackend.user?'signOut()':"route('auth')"}">${BuildLabBackend.user?'Sair':'Entrar / Criar conta'}</button></div></div>${views[page]()}</main><nav class="mobile-nav">${[['home','⌂','Início'],['courses','▣','Cursos'],['glossary','◉','Glossário'],['quiz','♧','Quiz'],['progress','▥','Progresso'],['auth','●','Conta']].map(([p,i,t])=>`<button class="${page===p?'active':''}" onclick="route('${p}')"><span>${i}</span>${t}</button>`).join('')}</nav></div>`}initializeAccount();
</script></body></html>
